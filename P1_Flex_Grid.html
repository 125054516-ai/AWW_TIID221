<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contenedor {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            
        }
        .card {
            width: 150px;
            padding: 20px;
            margin: 20px;
        }
        .card.largo {
            grid-column: 3;
            grid-row: span 3;

            display: flex;
            flex-direction: column
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="card" style="background-color: rgb(129, 33, 33);">CARD 1</div>
        <div class="card" style="background-color: rgb(113, 99, 99);">CARD 2</div>
        <div class="card largo" style="background-color: rgb(66, 10, 94);">CARD 3</div>
        <div class="card" style="background-color: rgb(31, 42, 126);">CARD 4</div>
        <div class="card" style="background-color: rgb(10, 126, 31);">CARD 5</div>
        <div class="card" style="background-color: rgb(126, 10, 10);">CARD 6</div>
        <div class="card" style="background-color: rgb(10, 126, 126);">CARD 7</div>

    </div>

</body>
</html>
